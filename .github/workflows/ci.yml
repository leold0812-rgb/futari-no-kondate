name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取り専用。CIは秘密値（Supabase / OpenAI / Blob / Cron）を一切使わずに通ることを保証する
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # 第三者Actionはcommit SHAで固定する（タグの付け替えによる供給網攻撃を避ける）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reject tracked env files
        # .env.example（値は空）以外の .env* がGit管理下にあれば失敗させる
        run: |
          tracked="$(git ls-files -- '.env*' ':!:.env.example')"
          if [ -n "$tracked" ]; then
            echo "::error::Git管理下に .env ファイルがあります: $tracked"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check client bundle for server secrets
        run: npm run check:bundle
