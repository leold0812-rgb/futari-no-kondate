name: CI

on:
  push:
    branches: [main]
  pull_request:

# 読み取り専用。CIは秘密値（Supabase / OpenAI / Blob / Cron）を一切使わずに通ることを保証する
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # 第三者Actionはcommit SHAで固定する（タグの付け替えによる供給網攻撃を避ける）
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Reject tracked env files
        # .env.example（値は空）以外の .env* がGit管理下にあれば失敗させる
        run: |
          tracked="$(git ls-files -- '.env*' ':!:.env.example')"
          if [ -n "$tracked" ]; then
            echo "::error::Git管理下に .env ファイルがあります: $tracked"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check client bundle for server secrets
        run: npm run check:bundle

  # Gate 1.1のDB（RLS / grants / 2人上限）テスト。
  # ランナー上のDockerでSupabaseのローカルDBだけを起動して検証する。hosted Supabase（Development / Production）には
  # 一切接続しない：認証情報・project ref・DB URL・GitHub Secretsを使わず、supabase link / --linked / db push も使わない。
  db:
    name: db / rls policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Guard against remote database targets
        # リモートDBを指す操作がpackage.jsonやDBスクリプトへ混入したら失敗させる
        run: |
          if grep -nE -e '--linked|--db-url|--project-ref|supabase (link|login|db push)' package.json scripts/db/*.sh; then
            echo "::error::リモートのSupabaseを指す可能性のある記述があります。CIではローカルDBのみを使用します。"
            exit 1
          fi

      - name: Install dependencies
        # Supabase CLI（package.jsonで固定したdevDependency）が入る。setup-cli等の追加Actionは使わない
        run: npm ci

      - name: Start local Supabase database
        run: npx supabase db start

      - name: Policy tests (pgTAP)
        run: npm run db:test

      - name: Concurrency test (2 connections)
        run: npm run db:test:concurrency

      - name: Show database logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_db_futari-no-kondate --tail 100

  # Gate 1.2 spike: PIN認証後にサーバーだけがAuth sessionを発行できるかの統合テスト。
  # ランナー上のDockerでSupabaseのローカルスタック（Auth / API）を起動して検証する。hosted Supabaseには接続しない。
  # 使うキーは `supabase status` が出力するローカル専用の既定鍵で、GitHub Secretsは使わない。
  auth:
    name: auth / session issuance (email provider ${{ matrix.email_provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ローカルの [auth.email] enable_signup（メールプロバイダーの有効/無効）。
        # リポジトリの既定は無効（匿名からのメール送信要求を断つ）。有効時の挙動も確認するため両方で実行する
        email_provider: [disabled, enabled]
    env:
      DO_NOT_TRACK: "1"
      SPIKE_EMAIL_PROVIDER: ${{ matrix.email_provider }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Guard against remote targets and embedded keys
        run: |
          if grep -nE -e '--linked|--db-url|--project-ref|supabase (link|login|db push)' package.json scripts/db/*.sh; then
            echo "::error::リモートのSupabaseを指す可能性のある記述があります。"
            exit 1
          fi
          if grep -rnE -e 'supabase\.co|sb_secret_|sb_publishable_|eyJ[A-Za-z0-9_-]{20,}' tests/integration; then
            echo "::error::統合テストにhosted URLまたはキーが埋め込まれています。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Configure email provider for this matrix entry
        if: matrix.email_provider == 'enabled'
        run: |
          sed -i '/^\[auth.email\]/,/^\[/ s/^enable_signup = false/enable_signup = true/' supabase/config.toml
          git diff --stat -- supabase/config.toml

      - name: Start local Supabase (Auth, API and Storage)
        # 不要なサービスは除外する。Auth(gotrue)・API gateway(kong)・PostgREST・Storage・Mailpitを使う
        run: npx supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Export local connection settings
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          echo "利用可能な変数名:"; cut -d= -f1 "$RUNNER_TEMP/supabase-local.env"
          set -a; . "$RUNNER_TEMP/supabase-local.env"; set +a
          {
            echo "SPIKE_SUPABASE_URL=${API_URL}"
            echo "SPIKE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SPIKE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          } >> "$GITHUB_ENV"

      - name: Integration tests (session issuance, bootstrap, PIN login, recipes)
        run: npm run test:integration

      - name: Bootstrap CLI end-to-end (local only)
        # Gate 1.3のCLIをNode 24の型除去でそのまま実行する。dry-run → apply → 再実行で変更なし、の順に確認する
        env:
          BOOTSTRAP_MEMBER_1_EMAIL: member-1@futari-no-kondate.invalid
          BOOTSTRAP_MEMBER_1_DISPLAY_NAME: CI太郎
          BOOTSTRAP_MEMBER_2_EMAIL: member-2@futari-no-kondate.invalid
          BOOTSTRAP_MEMBER_2_DISPLAY_NAME: CI花子
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="$SPIKE_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$SPIKE_ANON_KEY" SUPABASE_SERVICE_ROLE_KEY="$SPIKE_SERVICE_ROLE_KEY"
          node scripts/auth/bootstrap-couple.mts --project-ref local | tee "$RUNNER_TEMP/dry-run.log"
          grep -q "dry-runのため変更していません" "$RUNNER_TEMP/dry-run.log"
          node scripts/auth/bootstrap-couple.mts --project-ref local --apply
          node scripts/auth/bootstrap-couple.mts --project-ref local --apply | tee "$RUNNER_TEMP/rerun.log"
          grep -q "変更なし" "$RUNNER_TEMP/rerun.log"
          if [ "$SPIKE_EMAIL_PROVIDER" = "disabled" ]; then
            node scripts/auth/smoke-session.mts --project-ref local
          fi

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_auth_futari-no-kondate --tail 80

  # アプリ全体のE2E。ランナー上のDockerでローカルSupabaseを起動し、本番buildのNext.jsをPlaywright（Chromium・iPhone幅）で操作する。
  # hosted Supabase・GitHub Secretsは使わない。PIN_PEPPERと2人のPINは実行ごとの使い捨て値。
  e2e:
    name: e2e / app flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_MEMBER_1_NAME: E2E太郎
      E2E_MEMBER_2_NAME: E2E花子
      BOOTSTRAP_MEMBER_1_EMAIL: member-1@futari-no-kondate.invalid
      BOOTSTRAP_MEMBER_1_DISPLAY_NAME: E2E太郎
      BOOTSTRAP_MEMBER_2_EMAIL: member-2@futari-no-kondate.invalid
      BOOTSTRAP_MEMBER_2_DISPLAY_NAME: E2E花子
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Guard against remote targets
        run: |
          if grep -nE -e '--linked|--db-url|supabase (link|login|db push)' package.json scripts/db/*.sh; then
            echo "::error::リモートのSupabaseを指す可能性のある記述があります。"
            exit 1
          fi
          if grep -rnE -e 'supabase\.co|sb_secret_|sb_publishable_|eyJ[A-Za-z0-9_-]{20,}' tests/e2e playwright.config.ts; then
            echo "::error::E2Eにhosted URLまたはキーが埋め込まれています。"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start -x imgproxy,edge-runtime,logflare,vector,supavisor,studio,postgres-meta

      - name: Export local connection settings and test-only secrets
        run: |
          npx supabase status -o env > "$RUNNER_TEMP/supabase-local.env"
          set -a; . "$RUNNER_TEMP/supabase-local.env"; set +a
          pin_pepper=$(openssl rand -hex 32)
          cron_secret=$(openssl rand -hex 24)
          e2e_pin_1="$(shuf -i 100000-999999 -n 1)1"
          e2e_pin_2="$(shuf -i 100000-999999 -n 1)2"
          echo "::add-mask::$pin_pepper"
          echo "::add-mask::$cron_secret"
          echo "::add-mask::$e2e_pin_1"
          echo "::add-mask::$e2e_pin_2"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "PIN_PEPPER=${pin_pepper}"
            echo "CRON_SECRET=${cron_secret}"
            echo "E2E_PIN_1=${e2e_pin_1}"
            echo "E2E_PIN_2=${e2e_pin_2}"
          } >> "$GITHUB_ENV"

      - name: Bootstrap the two accounts and PINs
        run: |
          node scripts/auth/bootstrap-couple.mts --project-ref local --apply
          printf '%s\n' "$E2E_PIN_1" | node scripts/auth/set-pin.mts --project-ref local --member 1 --pin-stdin
          printf '%s\n' "$E2E_PIN_2" | node scripts/auth/set-pin.mts --project-ref local --member 2 --pin-stdin

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run e2e

      # E2Eで作ったデータをバックアップ→空にする→復元し、内容が一致するかを確かめる（Gate 8 復元テスト）
      - name: Backup restore round-trip
        run: node scripts/backup/roundtrip-check.mts --project-ref local

      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs supabase_auth_futari-no-kondate --tail 80
